<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X Lens</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span class="globe">🌐</span><div><h1>X Lens</h1><p>See the context behind the account.</p></div></header>
<main><label><span>Country beside names<small>Use X’s “Account based in” field.</small></span><input type="checkbox" id="showCountry"></label>
<h2>Optional filters</h2>
<label><span>Account age<small>Hide accounts younger than:</small></span><select id="minimumAgeMonths"><option value="0">Off</option><option value="6">6 months</option><option value="12">1 year</option><option value="24">2 years</option><option value="60">5 years</option></select></label>
<label><span>Connected via Android<small>Match X’s account connection field.</small></span><input type="checkbox" id="hideAndroid"></label>
<label><span>Connected via iOS / App Store<small>Match iOS, iPhone, iPad or App Store.</small></span><input type="checkbox" id="hideIOS"></label>
<label><span>Connected via Web<small>Match X’s account connection field.</small></span><input type="checkbox" id="hideWeb"></label>
<label class="text-label"><span>Bio keywords<small>Comma-separated words or phrases. Match any, ignoring case.</small></span><input type="text" id="bioKeywords" maxlength="1000" placeholder="venture, co-founder, investor"></label>
<label class="text-label"><span>Hide countries<small>Comma-separated countries or regions. Case, spaces and hyphens are ignored.</small></span><input type="text" id="hiddenCountries" maxlength="1000" placeholder="United States, South Asia"></label>
<label class="text-label"><span>Only show countries<small>Hide accounts based in any other country or region. Same format.</small></span><input type="text" id="shownCountries" maxlength="1000" placeholder="United States, South Asia"></label>
<h2>Hide distractions</h2>
<label><span>For you tab<small>Switch to Following when selected.</small></span><input type="checkbox" id="hideForYou"></label>
<label><span>Today’s News<small>Hide the news card on the right.</small></span><input type="checkbox" id="hideNews"></label>
<label><span>What’s happening<small>Hide the trends card on the right.</small></span><input type="checkbox" id="hideTrending"></label>
<div class="note">Filtered posts can be revealed. Missing information stays visible. This does not block or mute anyone.</div>
<button id="clearCache" type="button">Refresh saved account details</button><p id="status" role="status">Settings stay saved after the browser closes.</p></main>
<footer>No external server. No analytics.</footer><script src="model.js"></script><script src="popup.js"></script></body></html>
