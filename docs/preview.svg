<rect x="198" y="218" width="93" height="30" rx="7" fill="#14283a" stroke="#33536c"/>
<rect x="210" y="225" width="21" height="5" fill="#ff9933"/><rect x="210" y="230" width="21" height="5" fill="#fff"/><rect x="210" y="235" width="21" height="5" fill="#138808"/><circle cx="220.5" cy="232.5" r="2" fill="#000080"/>
<text x="239" y="239" fill="#bae6fd" font-size="13">India</text>
<text x="135" y="263" fill="#718399" font-size="13">@example_asha · illustrative preview</text>
<text x="80" y="310" fill="#e2e8f0" font-size="19">A little context makes a better feed.</text>
<path d="M80 337H607" stroke="#1d2c3e"/>
