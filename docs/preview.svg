<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
<title id="title">X Lens — see the context behind the account</title><desc id="desc">Illustration of a post with an India country badge and optional account age and Android filters. All names and content are fictional.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#131e2f"/></linearGradient><linearGradient id="accent"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient></defs>
<rect width="1040" height="470" rx="24" fill="url(#bg)"/>
<circle cx="960" cy="30" r="200" fill="#38bdf8" opacity=".035"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="52" y="64" fill="#7dd3fc" font-size="13" letter-spacing="3">A CLEARER VIEW OF X</text>
<text x="52" y="121" fill="#f1f5f9" font-size="45" font-weight="700">See who’s behind the post.</text>
<text x="54" y="157" fill="#94a3b8" font-size="17">Country context. Optional filters. All in your browser.</text>
